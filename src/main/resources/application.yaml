spring:
  application:
    name: shortlink
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 9
          min-idle: 0

server:
  port: 8080

shortlink:
  base-url: http://localhost:8082
  short-code:
    length: 6
    max-attempts: 10
  rate-limit:
    requests-per-minute: 2
    request-per-hour: 10
  cache:
    ttl-minutes: 30
  cleanup:
    interval-minutes: 30
    expired-urls-batch-size: 100

logging:
  level:
    com.codebreaker.shortlink: DEBUG
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"